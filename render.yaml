# Render Blueprint for the hosted demo. FREE plans only, and autoDeploy is off so every deploy is deliberate.
# Free Postgres expires 30 days after creation, followed by a 14-day grace period. The demo holds only synthetic,
# short-lived sessions, so expiry loses nothing that matters: recreate the database and redeploy (docs/DEPLOY.md).
services:
  - type: web
    name: caveat
    runtime: docker
    region: frankfurt   # same region as the database: the internal connection string only resolves there
    plan: free
    healthCheckPath: /api/health
    autoDeploy: false
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: caveat-db
          property: connectionString
      - key: CAVEAT_PG_SCHEMA
        value: caveat
      - key: CAVEAT_SECRET        # HMAC key for signed exports; generated by Render, never committed
        generateValue: true
      # Render's edge appends the client address plus proxy hops to X-Forwarded-For. Only the hop count is
      # trusted; anything further left is client-supplied and ignored. Verified after deploy (docs/DEPLOY.md).
      - key: CAVEAT_TRUST_PROXY_HOPS
        value: "3"
databases:
  - name: caveat-db
    plan: free
    region: frankfurt
    postgresMajorVersion: "16"
